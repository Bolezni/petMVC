spring:
  config:
    # Локальные переменные из .env (в git не попадает). На сервере переменные
    # приходят из docker compose, поэтому файл опционален.
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petProject}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SQL_DEBUG:false}
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  flyway:
    enabled: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  # 12 часов: браузерная сессия не должна разваливаться каждые 15 минут.
  # Для мобильного клиента срок можно уменьшить отдельной переменной.
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:43200000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:2592000000}

app:
  storage:
    path: ${STORAGE_PATH:./uploads}
  admin-key: ${ADMIN_KEY:}
  # внешний адрес приложения: нужен для ссылок в уведомлениях
  base-url: ${APP_BASE_URL:http://localhost:8080}
  telegram:
    # уведомления выключены, пока не заданы bot-token и chat-id
    enabled: ${TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  cors:
    # Пусто = CORS выключен, страницы и API на одном origin.
    # Для отдельного фронтенда: https://app.example.com или список через запятую.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    # время жизни подписанной ссылки на файл
    url-ttl-ms: ${MEDIA_URL_TTL_MS:900000}
    avatar-max-size: 5MB
  cookies:
    # true на сервере с HTTPS, false локально (по http браузер не пришлёт Secure-cookie)
    secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
