spring:
  config:
    # Локальные переменные из .env (в git не попадает). На сервере переменные
    # приходят из docker compose, поэтому файл опционален.
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petProject}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SQL_DEBUG:false}
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:2592000000}

app:
  storage:
    path: ${STORAGE_PATH:./uploads}
  admin-key: ${ADMIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}