<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Профиль — petMVP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

<div th:replace="~{fragments :: topbar}"></div>

<main class="container">
    <a class="back" th:href="@{/app}">← В кабинет</a>

    <h1>Профиль</h1>
    <p class="muted">Ваши данные видны только вам и вашему специалисту.</p>

    <div class="alert alert-ok" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Карточка: сводка актуальных данных -->
    <section class="card">
        <div class="section-title">
            <h2>Мои данные</h2>
            <span class="badge badge-done" th:text="${#strings.equals(#strings.toString(me.role), 'SPECIALIST') ? 'Специалист' : 'Клиент'}">Клиент</span>
        </div>

        <ul class="list">
            <li>
                <span class="muted">Имя</span>
                <span th:text="${(me.name != null ? me.name : '') + ' ' + (me.surname != null ? me.surname : '')} ?: '—'"></span>
            </li>
            <li>
                <span class="muted">Email</span>
                <span th:text="${me.email}"></span>
            </li>
            <li>
                <span class="muted">Телефон</span>
                <span th:text="${me.phone != null and !#strings.isEmpty(me.phone) ? me.phone : '—'}"></span>
            </li>
            <li>
                <span class="muted">Пол</span>
                <span th:text="${me.gender != null ? (#strings.equals(#strings.toString(me.gender), 'MAN') ? 'Мужской' : 'Женский') : '—'}"></span>
            </li>
            <li>
                <span class="muted">Дата рождения</span>
                <span th:text="${me.birthday != null ? #temporals.format(me.birthday, 'dd.MM.yyyy') : '—'}"></span>
            </li>
            <li>
                <span class="muted">Зарегистрирован</span>
                <span th:text="${me.createdAt != null ? #temporals.format(me.createdAt, 'dd.MM.yyyy') : '—'}"></span>
            </li>
        </ul>
    </section>

    <!-- Форма редактирования -->
    <form method="post" th:action="@{/app/profile}" th:object="${form}" class="form">

        <fieldset class="card">
            <legend>Основное</legend>

            <label class="field">
                <span class="field-label">Имя</span>
                <input type="text" th:field="*{name}" required
                       placeholder="Например: Иван">
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>

            <label class="field">
                <span class="field-label">Фамилия</span>
                <input type="text" th:field="*{surname}" required
                       placeholder="Например: Петров">
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></span>
            </label>
        </fieldset>

        <fieldset class="card">
            <legend>Контакты</legend>

            <label class="field">
                <span class="field-label">Email</span>
                <input type="email" th:field="*{email}" required
                       placeholder="you@example.com">
                <span class="hint">Используется для входа. Не должен быть занят другим аккаунтом.</span>
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>

            <label class="field">
                <span class="field-label">Телефон</span>
                <input type="tel" th:field="*{phone}" required
                       placeholder="+7 900 000-00-00">
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </label>
        </fieldset>

        <fieldset class="card">
            <legend>О себе</legend>

            <label class="field">
                <span class="field-label">Пол</span>
                <select th:field="*{gender}" required>
                    <option value="" disabled selected>Выберите пол</option>
                    <option th:each="g : ${genders}"
                            th:value="${g}"
                            th:text="${#strings.equals(#strings.toString(g), 'MAN') ? 'Мужской' : 'Женский'}"></option>
                </select>
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
            </label>

            <label class="field">
                <span class="field-label">Дата рождения</span>
                <input type="date" th:field="*{birthday}">
                <span class="hint">Необязательно, но помогает специалисту подобрать нагрузку.</span>
                <span class="hint" style="color: #dc2626;"
                      th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></span>
            </label>
        </fieldset>

        <button class="btn btn-primary btn-block" type="submit">Сохранить изменения</button>
    </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
