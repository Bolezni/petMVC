<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Вход — petMVP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments :: topbar}"></div>

<main class="container">
    <h1>Вход</h1>
    <p class="muted">Продолжите с того места, где остановились.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/login}" class="card form">
        <label class="field">
            <span class="field-label">Email</span>
            <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>

        <label class="field">
            <span class="field-label">Пароль</span>
            <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>

        <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>

    <p class="muted">
        Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
    </p>
</main>

</body>
</html>
