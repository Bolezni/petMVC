<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Анкета за пользователя — petMVP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

<div th:replace="~{fragments :: topbar}"></div>

<main class="container">
    <a class="back" th:href="@{/specialist/users/{id}(id=${userId})}">← К карточке</a>

    <h1>Анкета за пользователя</h1>
    <p class="muted">Заполняется со слов пользователя — например, на созвоне.</p>

    <div class="alert alert-error" th:if="${param.error}">
        Не удалось сохранить анкету.
    </div>

    <form method="post" th:action="@{/specialist/users/{id}/questionnaire(id=${userId})}" class="form">
        <fieldset class="card">
            <legend>О пользователе</legend>

            <label class="field">
                <span class="field-label">С чем пришёл?</span>
                <textarea name="request" rows="4" required
                          placeholder="Например: сидит за компьютером, болит поясница"></textarea>
            </label>
        </fieldset>

        <fieldset class="card">
            <legend>Цели</legend>

            <label class="field">
                <span class="field-label">Что хочет получить?</span>
                <textarea name="goals" rows="3" required
                          placeholder="Убрать боль в пояснице&#10;Заниматься 3 раза в неделю"></textarea>
                <span class="hint">Каждая цель — с новой строки.</span>
            </label>
        </fieldset>

        <fieldset class="card">
            <legend>Самочувствие и ограничения</legend>

            <label class="field">
                <span class="field-label">Самочувствие</span>
                <textarea name="wellbeing" rows="2" placeholder="Устаёт к вечеру, болит шея"></textarea>
            </label>

            <label class="field">
                <span class="field-label">Травмы и противопоказания</span>
                <textarea name="restrictions" rows="3" placeholder="Нельзя нагружать колено"></textarea>
                <span class="hint">Каждое ограничение — с новой строки.</span>
            </label>
        </fieldset>

        <button class="btn btn-primary btn-block" type="submit">Сохранить анкету</button>
    </form>
</main>

</body>
</html>
