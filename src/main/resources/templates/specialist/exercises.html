<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Библиотека упражнений — petMVP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

<div th:replace="~{fragments :: topbar}"></div>

<main class="container">
    <h1>Библиотека упражнений</h1>
    <p class="muted">Из неё собираются программы.</p>

    <div class="alert alert-ok" th:if="${param.created}">Упражнение добавлено в библиотеку.</div>
    <div class="alert alert-error" th:if="${param.error}">
        Не удалось сохранить упражнение. Ссылка на видео должна начинаться с https://
    </div>

    <section class="card">
        <div class="section-title">
            <h2>Добавить упражнение</h2>
        </div>

        <form method="post" th:action="@{/specialist/exercises}" class="form">
            <label class="field">
                <span class="field-label">Название</span>
                <input type="text" name="name" required maxlength="255" placeholder="Ягодичный мостик">
            </label>

            <label class="field">
                <span class="field-label">Описание</span>
                <textarea name="description" rows="2" maxlength="5000" placeholder="Как выполнять, на что смотреть"></textarea>
            </label>

            <label class="field">
                <span class="field-label">Группа мышц</span>
                <input type="text" name="muscleGroup" required maxlength="100" placeholder="Ягодицы">
            </label>

            <label class="field">
                <span class="field-label">Сложность</span>
                <select name="difficulty">
                    <option value="">Не указана</option>
                    <option th:each="d : ${difficulties}" th:value="${d}"
                            th:text="${d.name() == 'BEGINNER' ? 'Начальный' : (d.name() == 'INTERMEDIATE' ? 'Средний' : 'Продвинутый')}"></option>
                </select>
            </label>

            <label class="field">
                <span class="field-label">Ссылка на видео</span>
                <input type="url" name="videoUrl" maxlength="512" placeholder="https://www.youtube.com/watch?v=...">
                <span class="hint">Необязательно, но желательно — пользователь увидит кнопку «Смотреть видео».</span>
            </label>

            <button class="btn btn-primary btn-block" type="submit">Добавить в библиотеку</button>
        </form>
    </section>

    <section class="card">
        <div class="section-title">
            <h2>В библиотеке</h2>
            <span class="badge" th:text="${total + ' шт.'}"></span>
        </div>

        <form method="get" th:action="@{/specialist/exercises}" class="search-form">
            <input type="search" name="q" th:value="${q}" placeholder="Поиск по названию">
            <input type="text" name="muscleGroup" th:value="${muscleGroup}" placeholder="Группа мышц">
            <button class="btn btn-sm" type="submit">Найти</button>
            <a class="btn btn-sm" th:if="${q != null or muscleGroup != null}"
               th:href="@{/specialist/exercises}">Сбросить</a>
        </form>

        <div class="empty" th:if="${#lists.isEmpty(exercises)}">
            <div th:text="${q != null or muscleGroup != null ? 'Ничего не найдено по фильтру.' : 'Пока пусто. Добавьте первые упражнения.'}"></div>
        </div>

        <ul class="list" th:if="${!#lists.isEmpty(exercises)}">
            <li th:each="ex : ${exercises}">
                <div class="grow">
                    <div th:text="${ex.name}"></div>
                    <div class="muted small">
                        <span th:text="${ex.muscleGroup}"></span>
                        <span th:if="${ex.difficulty != null}"
                              th:text="${' · ' + (ex.difficulty.name() == 'BEGINNER' ? 'начальный' : (ex.difficulty.name() == 'INTERMEDIATE' ? 'средний' : 'продвинутый'))}"></span>
                    </div>
                </div>

                <div class="row-actions">
                    <a class="badge" th:if="${ex.videoUrl != null}" th:href="${ex.videoUrl}"
                       target="_blank" rel="noopener">видео</a>
                    <a class="btn btn-sm" th:href="@{/specialist/exercises/{id}/edit(id=${ex.id})}">Изменить</a>
                    <form method="post" th:action="@{/specialist/exercises/{id}/deactivate(id=${ex.id})}">
                        <button class="btn btn-sm" type="submit">Убрать</button>
                    </form>
                </div>
            </li>
        </ul>
    </section>
</main>

</body>
</html>
